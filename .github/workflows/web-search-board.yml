name: Web-search board

on:
  schedule:
    - cron: "17 10 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-search-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Require the Monid key
        env:
          MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
        run: |
          if [ -z "$MONID_API_KEY" ]; then
            echo "::error::MONID_API_KEY is not set; the board cannot refresh and will go stale"
            exit 1
          fi
      - name: Score new and stale endpoints
        env:
          MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
        working-directory: boards/web-search
        # A scheduled run scores at most 3 endpoints: ones the gateway added since the last run,
        # an excluded row's retry, then the stalest row older than 28 days (~$0.50). A manual run
        # scores every one that is due.
        run: python3 harness.py run --results results.json ${{ github.event_name == 'schedule' && '--max-models 3' || '' }}
      - name: Test the board
        run: python3 -m unittest tests.test_web_search_board
      - name: Commit the board
        run: |
          if git diff --quiet -- boards/web-search/results.json; then
            echo "nothing new"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boards/web-search/results.json
          git commit -m "chore(boards): refresh the web-search board"
          git pull --rebase origin main
          git push
